syntax = "proto3";

package file_service;

// Указываем правильный путь для кодогенерации согласно структуре репозитория
option go_package = "github.com/SiriusDocs/protos/gen/go/file";

service FileService {
  // Генерация Presigned URL для скачивания файла (GET)
  rpc GenerateDownloadURL (GenerateDownloadURLRequest) returns (GenerateDownloadURLResponse);
  
  // Генерация Presigned URL для прямой загрузки файла клиентом в S3 (PUT)
  rpc GenerateUploadURL (GenerateUploadURLRequest) returns (GenerateUploadURLResponse);
  
  // Получение метаданных файла (проверка существования, размер)
  rpc GetFileMetadata (GetFileMetadataRequest) returns (GetFileMetadataResponse);
  
  // Удаление файла из хранилища
  rpc DeleteFile (DeleteFileRequest) returns (DeleteFileResponse);

  // Копирование/перемещение файла внутри S3 (без скачивания в память)
  rpc CopyFile (CopyFileRequest) returns (CopyFileResponse);
}

message GenerateDownloadURLRequest {
  string bucket = 1;
  string object_key = 2; // Уникальный путь к файлу в S3
  int64 expiry_minutes = 3; // Время жизни ссылки
}

message GenerateDownloadURLResponse {
  string url = 1;
}

message GenerateUploadURLRequest {
  string bucket = 1;
  string object_key = 2;
  int64 expiry_minutes = 3;
  string content_type = 4; // Ожидаемый MIME-тип (опционально)
}

message GenerateUploadURLResponse {
  string url = 1;
}

message GetFileMetadataRequest {
  string bucket = 1;
  string object_key = 2;
}

message GetFileMetadataResponse {
  bool exists = 1;
  int64 size_bytes = 2;
  string content_type = 3;
  string last_modified = 4;
}

message DeleteFileRequest {
  string bucket = 1;
  string object_key = 2;
}

message DeleteFileResponse {
  bool success = 1;
}

message CopyFileRequest {
  string source_bucket = 1;
  string source_object_key = 2;
  string dest_bucket = 3;
  string dest_object_key = 4;
  bool delete_source = 5; // Если true, работает как Move (перемещение)
}

message CopyFileResponse {
  bool success = 1;
} 
